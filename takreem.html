:root{--bur:#6E1530;--deep:#4A0D20;--gold:#B88A2E;--gl:#E9C46A;--ivory:#FBF6EE;--ink:#2B1A1F;--mu:#6F5E55}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a0710;overflow:hidden;font-family:Marhey,'Segoe UI',Tahoma,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:1600px;height:900px;transform-origin:center center;background:radial-gradient(ellipse at 50% 42%,#fffdf8 0%,var(--ivory) 55%,#f1e6d3 100%);overflow:hidden}
.b1{position:absolute;inset:22px;border:3px solid var(--bur);border-radius:6px;pointer-events:none}
.b2{position:absolute;inset:32px;border:1.5px solid var(--gold);border-radius:3px;pointer-events:none}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .7s ease;padding:70px 90px}
.sl.on{opacity:1}
.chip{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:var(--bur);color:#F3D891;padding:8px 30px;border-radius:999px;font-size:26px;white-space:nowrap}
.school{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:22px;color:var(--mu)}
/* الطالبة */
.name{font-size:104px;font-weight:700;color:var(--bur);white-space:nowrap;line-height:1.25;margin-top:26px;opacity:0;text-shadow:0 0 0 rgba(233,196,106,0)}
.sl.on .name{animation:nameIn .5s ease 3.3s forwards,beat 1.25s ease-in-out 3.3s 2,glow 2.5s ease-in-out 3.3s 1}
@keyframes nameIn{from{opacity:0}to{opacity:1}}
@keyframes beat{0%{transform:scale(1)}14%{transform:scale(1.09)}28%{transform:scale(1)}42%{transform:scale(1.07)}70%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{text-shadow:0 0 0 rgba(233,196,106,0)}40%{text-shadow:0 0 38px rgba(233,196,106,.9)}}
.award{order:1}.name{order:2}.desc{order:3}.praise{order:4}
.award{display:flex;align-items:center;gap:34px;opacity:0;transform:translateY(30px) scale(.8)}
.sl.on .award{animation:pop .8s cubic-bezier(.2,1.4,.4,1) .3s forwards}
@keyframes pop{to{opacity:1;transform:none}}
.heart{width:70px;height:64px}
.sl.on .heart{animation:hb 1.25s ease-in-out .6s infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.rk{font-size:46px;font-weight:700;color:var(--bur);white-space:nowrap}
.rk small{font-size:26px;color:var(--mu);font-weight:400;margin-inline-start:8px}
.desc{margin-top:14px;font-size:30px;color:var(--mu);white-space:nowrap;opacity:0}
.praise{margin-top:10px;font-size:38px;color:var(--gold);white-space:nowrap;opacity:0}
.sl.on .desc{animation:fade .8s ease 4.4s forwards}.sl.on .praise{animation:fade .8s ease 5.1s forwards}
@keyframes fade{to{opacity:1}}
/* افتتاح/مجموعة/ختام */
.big{font-size:120px;font-weight:700;color:var(--bur);line-height:1.2}
.sub{font-size:40px;color:var(--ink);margin-top:6px}
.sub2{font-size:28px;color:var(--mu);margin-top:8px}
.gl{font-size:84px;font-weight:700;color:var(--bur)}
.gc{font-size:46px;color:var(--gold);margin-top:6px}
.verse{font-size:40px;color:var(--bur);margin-top:26px}
.sig{display:flex;justify-content:space-between;width:1100px;margin-top:60px;font-size:30px}
.sig div{display:flex;flex-direction:column;align-items:center}.sig small{font-size:20px;color:var(--mu)}
#confetti{position:absolute;inset:0;pointer-events:none}
/* بداية */

  if(s.t==='sara')return '<div class="chip">'+esc(s.lvl)+' ◆ '+esc(s.cat)+'</div><div class="name">'+esc(s.n)+'</div><div class="award">'+HEART+medal(0,120)+'<div class="rk">وسام المثابرة والإصرار</div>'+medal(0,120)+HEART+'</div><div class="desc">الشعبة '+'<bdi dir="ltr">'+esc(s.s)+'</bdi></div><div class="praise">همّةٌ لا تعرف التوقف.. وإصرارٌ يصنع النجاح</div><div class="school">مدرسة الشيماء الثانوية للبنات</div>';
  const icon=s.r<=3?cup(s.r,s.r===1?150:125):medal(s.r,100);
  return '<div class="chip">'+esc(s.lvl)+' ◆ '+esc(s.cat)+'</div><div class="name">'+esc(s.n)+'</div><div class="award">'+HEART+icon+'<div class="rk">المركز '+s.ord+(s.tie?'<small>مكرر</small>':'')+'</div>'+HEART+'</div><div class="desc">الشعبة <bdi dir="ltr">'+esc(s.s)+'</bdi></div><div class="praise">'+(PR[s.r]||PRO[i%PRO.length])+'</div><div class="school">مدرسة الشيماء الثانوية للبنات</div>'}
const box=document.getElementById('slides');box.innerHTML=S.map((s,i)=>'<section class="sl">'+html(s,i)+'</section>').join('');
const els=[...box.children];
/* تحجيم الإطار ليملأ الشاشة */
function fit(){const f=document.getElementById('frame');const k=Math.min(innerWidth/1600,innerHeight/900);f.style.transform='scale('+k+')'}addEventListener('resize',fit);fit();
/* الصوت: نبض قلب ثم نغمة احتفالية وتصفيق للمركز الأول */
let ac=null,snd=true;function A(){if(!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
function thump(t,f,v){const a=A();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.25)}
function heartbeat(){const a=A();if(!a||!snd)return;const t=a.currentTime+.05;for(let i=0;i<3;i++){thump(t+i*1.25,95,.9);thump(t+i*1.25+.22,80,.6)}}
function chime(big){const a=A();if(!a||!snd)return;const t=a.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.18,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.9);o.connect(g).connect(a.destination);o.start(t+i*.12);o.stop(t+i*.12+1)});
  if(big){const n=a.sampleRate*2.2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){const env=Math.min(1,i/(a.sampleRate*.2))*Math.max(0,1-i/n);d[i]=(Math.random()*2-1)*env*(Math.random()<.35?1:.25)}const s=a.createBufferSource(),g=a.createGain();g.gain.value=.22;s.buffer=b;s.connect(g).connect(a.destination);s.start(t+.3)}}
/* قصاصات وقلوب */
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');let P=[];
function burst(n,hearts){const col=['#6E1530','#B88A2E','#E9C46A','#B0263F','#F3D891'];for(let i=0;i<n;i++){P.push({x:hearts?(Math.random()<.5?120+Math.random()*300:1180+Math.random()*300):800+(Math.random()-.5)*500,y:hearts?840:430,vx:(Math.random()-.5)*(hearts?3:16),vy:hearts?-(2+Math.random()*3):-(6+Math.random()*12),g:hearts?-.01:.32,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:hearts?14+Math.random()*14:6+Math.random()*7,c:col[i%col.length],h:hearts,life:hearts?260:200})}}
function hpath(x,y,s){cx.beginPath();cx.moveTo(x,y+s*.3);cx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);cx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);cx.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);cx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);cx.fill()}
(function loop(){cx.clearRect(0,0,1600,900);P=P.filter(p=>p.life-->0&&p.y<960&&p.y>-60);P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.globalAlpha=Math.min(1,p.life/60);cx.fillStyle=p.h?'#B0263F':p.c;if(p.h){hpath(p.x,p.y,p.s)}else{cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}cx.restore()});requestAnimationFrame(loop)})();
/* التشغيل */
let cur=-1,playing=true,timer=null,t0=0,dur=10;const tm=[];
const lenOf=s=>s.t==='stu'||s.t==='sara'?dur:s.t==='group'?5:7;
function clearT(){tm.forEach(clearTimeout);tm.length=0;clearTimeout(timer)}
function go(i){if(i<0)i=0;if(i>=els.length){i=els.length-1;playing=false;upd()}clearT();P=[];
  els.forEach((e,j)=>{if(j===cur&&j!==i){e.classList.remove('on')}});const e=els[i];e.classList.remove('on');void e.offsetWidth;e.classList.add('on');cur=i;
  const s=S[i];document.getElementById('cnt').textContent=(i+1)+' / '+els.length;
  if(s.t==='stu'||s.t==='sara'){heartbeat();tm.push(setTimeout(()=>{chime(s.r===1);burst(s.r===1?220:s.r<=3?150:90,false)},3300));tm.push(setTimeout(()=>burst(18,true),4100))}
  if(s.t==='close'){chime(true);burst(260,false);tm.push(setTimeout(()=>burst(30,true),800))}
  t0=performance.now();if(playing)timer=setTimeout(()=>go(cur+1),lenOf(s)*1000)}
(function pr(){const s=S[cur];const p=document.getElementById('prog');if(s&&playing){p.style.width=Math.min(100,(performance.now()-t0)/(lenOf(s)*10))+'%'}requestAnimationFrame(pr)})();
function upd(){document.getElementById('bPlay').textContent=playing?'⏸':'▶';document.getElementById('bMan').classList.toggle('on',!playing);document.body.classList.toggle('manual',!playing)}
function toggle(){playing=!playing;upd();clearTimeout(timer);if(playing){t0=performance.now();timer=setTimeout(()=>go(cur+1),lenOf(S[cur])*1000)}}
document.getElementById('bPlay').onclick=toggle;document.getElementById('bMan').onclick=toggle;
document.getElementById('bNext').onclick=()=>go(cur+1);document.getElementById('bPrev').onclick=()=>go(cur-1);
document.getElementById('bSnd').onclick=function(){snd=!snd;this.textContent=snd?'🔊':'🔇'};
document.getElementById('bDur').onchange=function(){dur=+this.value};
function full(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
document.getElementById('bFull').onclick=full;
addEventListener('keydown',e=>{if(e.key==='F5'||e.key==='Escape'&&!document.fullscreenElement){e.preventDefault()}if(!document.getElementById('start').classList.contains('gone'))return;const k=e.key;
  if(k===' '||k==='.'||k==='b'||k==='B'){e.preventDefault();toggle()}
  else if(['ArrowLeft','PageDown','ArrowDown','Enter','n','N'].includes(k)){e.preventDefault();go(cur+1)}
  else if(['ArrowRight','PageUp','ArrowUp','Backspace','p','P'].includes(k)){e.preventDefault();go(cur-1)}
  else if(k==='f'||k==='F')full();else if(k==='m'||k==='M')document.getElementById('bSnd').click()});
document.getElementById('stage').addEventListener('click',()=>{if(!playing)go(cur+1)});
document.getElementById('stage').addEventListener('contextmenu',e=>{if(!playing){e.preventDefault();go(cur-1)}});
let idle;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('idle'),2500)});
function begin(man){A();if(ac&&ac.resume)ac.resume();document.getElementById('start').classList.add('gone');full();playing=!man;upd();go(0);idle=setTimeout(()=>document.body.classList.add('idle'),2500)}
let MAN=false;document.querySelectorAll('#mode span').forEach(x=>x.onclick=()=>{MAN=x.dataset.m==='1';document.querySelectorAll('#mode span').forEach(y=>y.classList.toggle('sel',y===x))});
document.getElementById('go').onclick=()=>begin(MAN);
</script>
